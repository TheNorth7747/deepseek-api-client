<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover 是 env(safe-area-inset-*) 生效的前提，刘海屏与home指示条都依赖它 -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <!-- 独立窗口运行：Android/桌面 Chromium 走 manifest，iOS Safari 走 apple-mobile-web-app-* -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DeepSeek" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <title>API 使用 demo</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
